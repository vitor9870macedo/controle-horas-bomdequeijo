<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Registre seu ponto de entrada e saída" />
    <meta name="theme-color" content="#00d9ff" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../imagens/ponto.png" />
    <link rel="icon" href="../imagens/ponto.png" type="image/png" />
    <title>Registrar Ponto - VTek</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="funcionario-page">
    <div class="container">
      <div class="card">
        <div class="header with-logo">
          <a href="../../index.html" class="back-btn">← Voltar</a>
          <img
            src="../imagens/vtek-removebg-preview.png"
            alt="VTek"
            class="header-logo"
          />
        </div>

        <div class="clock-display">
          <div id="currentTime" class="current-time"></div>
          <div id="currentDate" class="current-date"></div>
        </div>

        <form id="pontoForm" class="ponto-form">
          <div class="form-group">
            <label for="funcionario">Selecione seu nome:</label>
            <select id="funcionario" required>
              <option value="">Escolha seu nome...</option>
              <!-- Será preenchido dinamicamente pelo JavaScript -->
            </select>
          </div>

          <div class="form-group">
            <label for="pin">Digite seu PIN (4 dígitos):</label>
            <input
              type="text"
              id="pin"
              maxlength="4"
              pattern="[0-9]{4}"
              placeholder="••••"
              required
              autocomplete="off"
              readonly
            />
          </div>

          <!-- Teclado Numérico -->
          <div class="numpad">
            <button type="button" class="numpad-btn" data-number="1">1</button>
            <button type="button" class="numpad-btn" data-number="2">2</button>
            <button type="button" class="numpad-btn" data-number="3">3</button>
            <button type="button" class="numpad-btn" data-number="4">4</button>
            <button type="button" class="numpad-btn" data-number="5">5</button>
            <button type="button" class="numpad-btn" data-number="6">6</button>
            <button type="button" class="numpad-btn" data-number="7">7</button>
            <button type="button" class="numpad-btn" data-number="8">8</button>
            <button type="button" class="numpad-btn" data-number="9">9</button>
            <button
              type="button"
              class="numpad-btn numpad-clear"
              data-action="clear"
            >
              ✕
            </button>
            <button type="button" class="numpad-btn" data-number="0">0</button>
            <button
              type="button"
              class="numpad-btn numpad-backspace"
              data-action="backspace"
            >
              ⌫
            </button>
          </div>

          <div class="registro-info" id="ultimoRegistro">
            <!-- Será preenchido dinamicamente -->
          </div>

          <div class="action-buttons">
            <button
              type="submit"
              data-action="entrada"
              class="btn btn-success btn-large"
            >
              <span class="btn-icon">🟢</span>
              Registrar Entrada
            </button>

            <button
              type="submit"
              data-action="saida"
              class="btn btn-danger btn-large"
            >
              <span class="btn-icon">🔴</span>
              Registrar Saída
            </button>
          </div>
        </form>

        <div id="message" class="message"></div>
      </div>
    </div>

    <script>
      // Relógio em tempo real
      function updateClock() {
        const now = new Date();

        const timeString = now.toLocaleTimeString("pt-BR", {
          timeZone: "America/Sao_Paulo",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });

        const dateString = now.toLocaleDateString("pt-BR", {
          timeZone: "America/Sao_Paulo",
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        const timeEl = document.getElementById("currentTime");
        const dateEl = document.getElementById("currentDate");

        if (timeEl) timeEl.textContent = timeString;
        if (dateEl) dateEl.textContent = dateString;
      }

      updateClock();
      setInterval(updateClock, 1000);

      // Teclado numérico
      const pinInput = document.getElementById("pin");
      const numpadButtons = document.querySelectorAll(".numpad-btn");

      numpadButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const number = btn.dataset.number;
          const action = btn.dataset.action;

          if (action === "clear") {
            pinInput.value = "";
          } else if (action === "backspace") {
            pinInput.value = pinInput.value.slice(0, -1);
          } else if (number && pinInput.value.length < 4) {
            pinInput.value += number;
          }
        });
      });
    </script>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
